version: '3.8'

services:
  frontend:
    build:
      context: ./src/frontend-app
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./src/backend-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./src/backend-gateway/.env
    restart: unless-stopped

  asset-storage:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/asset-storage/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/asset-storage/assets:/usr/share/nginx/html/assets:ro
    restart: unless-stopped
