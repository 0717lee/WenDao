[pytest]
testpaths = src/backend-gateway/tests
pythonpath = src/backend-gateway

markers =
    integration: Integration tests requiring real external dependencies (FAISS, database)
    unit: Unit tests using mocks to isolate external dependencies
    e2e: End-to-end tests requiring full service running

addopts =
    --cov=src/backend-gateway
    --cov-report=term-missing
    --cov-report=html
    --tb=short
    -v
    --strict-markers

asyncio_mode = auto
console_output_style = progress
