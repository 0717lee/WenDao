<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="seal-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c42b2e"/>
      <stop offset="100%" stop-color="#8c1a11"/>
    </linearGradient>
    <linearGradient id="gold-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4b06a"/>
      <stop offset="100%" stop-color="#c9a063"/>
    </linearGradient>
    <linearGradient id="page-shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f3e8"/>
      <stop offset="100%" stop-color="#ede6d3"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <!-- Subtle texture filter -->
    <filter id="paper-tex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply" result="blend"/>
      <feComponentTransfer in="blend">
        <feFuncA type="linear" slope="1"/>
      </feComponentTransfer>
    </filter>
    <!-- Soft shadow -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1a1410" flood-opacity="0.25"/>
    </filter>
    <filter id="inner-glow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="0"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1"/>
      <feFlood flood-color="#c9a063" flood-opacity="0.15"/>
      <feComposite in2="SourceGraphic" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Clip for seal shape -->
    <clipPath id="seal-clip">
      <rect x="56" y="56" width="400" height="400" rx="48"/>
    </clipPath>
  </defs>

  <!-- ====== OUTER SEAL (rounded square, like a Chinese stamp 印章) ====== -->
  <rect x="56" y="56" width="400" height="400" rx="48" fill="url(#seal-bg)" filter="url(#soft-shadow)"/>

  <!-- Inner border (double-line, traditional) -->
  <rect x="72" y="72" width="368" height="368" rx="36" fill="none" stroke="#d4b06a" stroke-width="2.5" opacity="0.6"/>
  <rect x="82" y="82" width="348" height="348" rx="30" fill="none" stroke="#d4b06a" stroke-width="1" opacity="0.35"/>

  <!-- Subtle corner ornaments (traditional 角花) -->
  <!-- Top-left -->
  <g opacity="0.4" stroke="#d4b06a" stroke-width="1.5" fill="none">
    <path d="M100 108 L100 92 Q100 82 110 82 L126 82"/>
    <path d="M108 100 L92 100 Q82 100 82 110 L82 126"/>
    <!-- Top-right -->
    <path d="M412 108 L412 92 Q412 82 402 82 L386 82"/>
    <path d="M404 100 L420 100 Q430 100 430 110 L430 126"/>
    <!-- Bottom-left -->
    <path d="M100 404 L100 420 Q100 430 110 430 L126 430"/>
    <path d="M108 412 L92 412 Q82 412 82 402 L82 386"/>
    <!-- Bottom-right -->
    <path d="M412 404 L412 420 Q412 430 402 430 L386 430"/>
    <path d="M404 412 L420 412 Q430 412 430 402 L430 386"/>
  </g>

  <!-- ====== OPEN BOOK (central motif) ====== -->
  <g transform="translate(256, 230)">
    <!-- Left page -->
    <path d="M-8 -70 Q-8 -80 -18 -82 Q-68 -90 -108 -72 Q-115 -68 -115 -60 L-115 56 Q-115 64 -108 66 Q-68 78 -18 68 Q-8 66 -8 56 Z"
          fill="url(#page-shade)" stroke="#d4b06a" stroke-width="1.2" opacity="0.95"/>
    <!-- Right page -->
    <path d="M8 -70 Q8 -80 18 -82 Q68 -90 108 -72 Q115 -68 115 -60 L115 56 Q115 64 108 66 Q68 78 18 68 Q8 66 8 56 Z"
          fill="url(#page-shade)" stroke="#d4b06a" stroke-width="1.2" opacity="0.95"/>
    <!-- Book spine shadow -->
    <path d="M-8 -70 Q0 -74 8 -70 L8 56 Q0 62 -8 56 Z" fill="#2a2018" opacity="0.12"/>

    <!-- Classical text lines on left page (vertical layout, like real 古籍) -->
    <g fill="#2a2018" opacity="0.55">
      <!-- Vertical lines, right to left (traditional reading order) -->
      <rect x="-28" y="-58" width="1.5" height="100" rx="0.75"/>
      <rect x="-42" y="-54" width="1.5" height="92" rx="0.75"/>
      <rect x="-56" y="-50" width="1.5" height="84" rx="0.75"/>
      <rect x="-70" y="-48" width="1.5" height="78" rx="0.75"/>
      <rect x="-84" y="-46" width="1.5" height="72" rx="0.75"/>
      <rect x="-96" y="-44" width="1.5" height="66" rx="0.75"/>
    </g>
    <!-- Text lines on right page -->
    <g fill="#2a2018" opacity="0.55">
      <rect x="26" y="-58" width="1.5" height="100" rx="0.75"/>
      <rect x="40" y="-54" width="1.5" height="92" rx="0.75"/>
      <rect x="54" y="-50" width="1.5" height="84" rx="0.75"/>
      <rect x="68" y="-48" width="1.5" height="78" rx="0.75"/>
      <rect x="82" y="-46" width="1.5" height="72" rx="0.75"/>
      <rect x="96" y="-44" width="1.5" height="66" rx="0.75"/>
    </g>
  </g>

  <!-- ====== 「智」Character (AI brain concept, centered above book) ====== -->
  <!-- Stylized "智" rendered as a clean glyph -->
  <text x="256" y="195" text-anchor="middle" dominant-baseline="central"
        font-family="'ZCOOL XiaoWei', 'Noto Serif SC', 'STZhongsong', serif"
        font-size="72" font-weight="700" fill="#f7f3e8" opacity="0.92"
        filter="url(#inner-glow)">智</text>

  <!-- ====== AI / Neural sparkle accents (representing intelligence) ====== -->
  <g stroke="url(#gold-accent)" fill="none" stroke-width="1.5" opacity="0.7">
    <!-- Left sparkle -->
    <circle cx="148" cy="178" r="3" fill="#d4b06a" stroke="none"/>
    <line x1="148" y1="170" x2="148" y2="186"/>
    <line x1="140" y1="178" x2="156" y2="178"/>
    <!-- Right sparkle -->
    <circle cx="364" cy="178" r="3" fill="#d4b06a" stroke="none"/>
    <line x1="364" y1="170" x2="364" y2="186"/>
    <line x1="356" y1="178" x2="372" y2="178"/>
    <!-- Connecting dots (neural network hint) -->
    <circle cx="178" cy="148" r="2" fill="#d4b06a" stroke="none" opacity="0.5"/>
    <circle cx="334" cy="148" r="2" fill="#d4b06a" stroke="none" opacity="0.5"/>
    <circle cx="196" cy="130" r="1.5" fill="#d4b06a" stroke="none" opacity="0.35"/>
    <circle cx="316" cy="130" r="1.5" fill="#d4b06a" stroke="none" opacity="0.35"/>
  </g>

  <!-- ====== Bottom text band ====== -->
  <text x="256" y="370" text-anchor="middle" dominant-baseline="central"
        font-family="'ZCOOL XiaoWei', 'Noto Serif SC', 'STZhongsong', serif"
        font-size="28" letter-spacing="12" fill="#f7f3e8" opacity="0.85">古籍智解</text>

  <!-- Thin gold separator above text -->
  <line x1="170" y1="342" x2="342" y2="342" stroke="#d4b06a" stroke-width="1" opacity="0.5"/>

  <!-- Subtle bottom subtitle -->
  <text x="256" y="400" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Serif SC', serif"
        font-size="13" letter-spacing="4" fill="#d4b06a" opacity="0.55">TEXTTWIN</text>
</svg>