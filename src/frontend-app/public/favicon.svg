<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c42b2e"/>
      <stop offset="100%" stop-color="#8c1a11"/>
    </linearGradient>
  </defs>
  <!-- Rounded square seal -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="url(#bg)"/>
  <!-- Inner border -->
  <rect x="4" y="4" width="24" height="24" rx="4.5" fill="none" stroke="#d4b06a" stroke-width="0.8" opacity="0.5"/>
  <!-- 智 character -->
  <text x="16" y="17.5" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Serif SC', 'STZhongsong', serif"
        font-size="16" font-weight="700" fill="#f7f3e8">智</text>
</svg>